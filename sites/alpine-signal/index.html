<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alpine Signal — 91.4 FM</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2a1c14;
      color: #f0e2cc;
      font-family: "DM Sans", sans-serif;
      background-image: radial-gradient(rgba(255,200,120,.05) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    a { color: #e0b07a; }
    .cabin {
      max-width: 1080px; margin: 0 auto; padding: 1.2rem;
    }
    header { display: flex; justify-content: space-between; font-size: .78rem; margin-bottom: 1rem; }
    .radio {
      display: grid; grid-template-columns: 1.15fr .85fr;
      background: #3b281c;
      border: 10px solid #5a3b28;
      box-shadow: inset 0 0 0 2px #c4a574, 0 30px 50px rgba(0,0,0,.4);
      overflow: hidden;
    }
    .dial {
      padding: 1.6rem;
      background: url("hero.jpg") center/cover no-repeat;
      min-height: 58vh; position: relative;
    }
    .dial::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent, rgba(20,10,6,.72));
    }
    .now {
      position: absolute; z-index: 1; left: 1.4rem; bottom: 1.4rem;
    }
    .now small { letter-spacing: .2em; font-size: .7rem; }
    .now h1 { font-family: Fraunces, serif; font-size: clamp(2rem, 5vw, 3.4rem); }
    .panel { padding: 1.6rem; background: #4a3224; }
    label { display: block; font-size: .72rem; letter-spacing: .18em; margin-bottom: .4rem; }
    input[type=range] { width: 100%; accent-color: #e0b07a; }
    .freq {
      font-family: Fraunces, serif; font-size: 3.4rem; color: #d6f5c8;
      text-shadow: 0 0 18px #8f8; margin: .4rem 0 1rem;
    }
    .prog { list-style: none; }
    .prog li { display: flex; justify-content: space-between; padding: .55rem 0; border-bottom: 1px solid #6a4a36; font-size: .9rem; }
    .live { color: #d6f5c8; }
    footer { margin-top: 1rem; font-size: .75rem; display: flex; justify-content: space-between; opacity: .7; }
    @media (max-width: 800px) { .radio { grid-template-columns: 1fr; } .dial { min-height: 42vh; } }
  </style>
</head>
<body>
  <div class="cabin">
    <header>
      <a href="../../index.html">← Tenfold 08</a>
      <span>Cabin altitude 1,840m · snow</span>
    </header>
    <div class="radio">
      <div class="dial">
        <div class="now">
          <small>ON AIR</small>
          <h1>Alpine Signal</h1>
        </div>
      </div>
      <div class="panel">
        <label for="tuner">TUNING</label>
        <div class="freq"><span id="fm">91.4</span> <small style="font-size:1rem">FM</small></div>
        <input id="tuner" type="range" min="880" max="1080" value="914" />
        <ul class="prog">
          <li><span>06:00</span><span>Woodstove weather</span></li>
          <li class="live"><span>NOW</span><span>Vacuum-tube nocturne</span></li>
          <li><span>22:00</span><span>Letters from the pass</span></li>
          <li><span>00:00</span><span>Static, on purpose</span></li>
        </ul>
      </div>
    </div>
    <footer>
      <span>91.4 — the mountain keeps the signal honest</span>
      <span>Tubes warm in 47 seconds</span>
    </footer>
  </div>
  <script>
    const t = document.getElementById("tuner");
    const fm = document.getElementById("fm");
    t.addEventListener("input", () => { fm.textContent = (t.value/10).toFixed(1); });
  </script>
</body>
</html>
