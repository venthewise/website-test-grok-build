<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TENFOLD — ten rooms, ten worlds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#0b0b0c; --paper:#ece6d8; --mute:#8a8478; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: "Bodoni Moda", serif;
      overflow: hidden;
    }
    header {
      position: fixed; inset: 0 0 auto 0; z-index: 5;
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 1.4rem 2rem;
      mix-blend-mode: difference;
      pointer-events: none;
    }
    header h1 { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 700; letter-spacing: .28em; }
    header p { font-family: "IBM Plex Mono", monospace; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; }
    .stage {
      display: flex; height: 100vh;
      overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }
    .stage::-webkit-scrollbar { height: 0; }
    .hero, .door {
      flex: 0 0 100vw; height: 100vh;
      scroll-snap-align: start;
      position: relative;
    }
    .hero {
      background: #000 url("assets/corridor.jpg") center/cover no-repeat;
    }
    .hero::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.55), transparent 40%, rgba(0,0,0,.4));
    }
    .hero-copy {
      position: absolute; z-index: 2; left: 6vw; bottom: 12vh; max-width: 28rem;
    }
    .hero-copy em { display: block; font-style: italic; font-size: clamp(2.6rem, 7vw, 5.4rem); line-height: .9; }
    .hero-copy span {
      display: block; margin-top: 1.2rem;
      font-family: "IBM Plex Mono", monospace; font-size: .72rem; letter-spacing: .2em; color: #cfc6b4;
    }
    .scroll-hint {
      position: absolute; right: 2rem; bottom: 2rem; z-index: 2;
      font-family: "IBM Plex Mono", monospace; font-size: .65rem; letter-spacing: .24em;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .35; } }
    .door {
      display: grid; place-items: center;
      padding: 8vh 6vw;
    }
    .door a {
      display: block;
      width: min(42vw, 420px); height: min(78vh, 720px);
      text-decoration: none; color: inherit;
      transform: perspective(1400px) rotateY(var(--tilt, 0deg));
      transition: transform .5s cubic-bezier(.2,.8,.2,1), filter .4s;
      filter: saturate(1.05);
    }
    .door a:hover { transform: perspective(1400px) rotateY(0) scale(1.015); filter: saturate(1.2) brightness(1.05); }
    .frame {
      height: 100%;
      border: 14px solid;
      display: grid; place-items: end start;
      padding: 1.6rem;
      background:
        linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55)),
        var(--shot) center/cover no-repeat;
    }
    .meta { font-family: "IBM Plex Mono", monospace; font-size: .68rem; letter-spacing: .22em; }
    .title { font-size: clamp(2.2rem, 6vw, 4.4rem); line-height: .9; }
    .num { position: absolute; top: 7vh; left: 6vw; font-size: 5rem; opacity: .18; pointer-events: none; }
    footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 4;
      display: flex; gap: .4rem; justify-content: center; padding: .8rem;
    }
    footer button {
      width: 10px; height: 10px; border-radius: 50%;
      border: 0; background: #5c574e; cursor: pointer;
    }
    footer button.on { background: var(--paper); }
    @media (max-width: 720px) {
      body { overflow: auto; }
      .stage { flex-direction: column; height: auto; overflow: visible; scroll-snap-type: none; }
      .hero, .door { flex-basis: auto; min-height: 100vh; width: 100%; }
      .door a { width: 78vw; height: 62vh; }
      footer { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TENFOLD</h1>
    <p>Gallery 00 — public rooms</p>
  </header>
  <div class="stage" id="stage">
    <section class="hero">
      <div class="hero-copy">
        <em>Ten doors.<br/>None alike.</em>
        <span>Scroll sideways · a private exhibition of invented worlds</span>
      </div>
      <div class="scroll-hint">DRAG →</div>
    </section>
  </div>
  <footer id="dots"></footer>
  <script>
    const rooms = [
      { slug:"obsidian-atelier", n:"01", name:"Obsidian Atelier", frame:"#c5a15a", bg:"#1a140c", tilt:"-8deg" },
      { slug:"neon-bazaar", n:"02", name:"Neon Bazaar", frame:"#ff2bd6", bg:"#120018", tilt:"6deg" },
      { slug:"paper-tide", n:"03", name:"Paper Tide", frame:"#d8c7a4", bg:"#1c2428", tilt:"-4deg" },
      { slug:"brut-440", n:"04", name:"BRUT 440", frame:"#ff6a00", bg:"#111", tilt:"9deg" },
      { slug:"ink-steam", n:"05", name:"Ink & Steam", frame:"#c23b22", bg:"#2a241c", tilt:"-7deg" },
      { slug:"solar-archive", n:"06", name:"Solar Archive", frame:"#7ec8ff", bg:"#050814", tilt:"5deg" },
      { slug:"velvet-circus", n:"07", name:"Velvet Circus", frame:"#e11d48", bg:"#1a0508", tilt:"-6deg" },
      { slug:"alpine-signal", n:"08", name:"Alpine Signal", frame:"#c4a574", bg:"#1a120c", tilt:"4deg" },
      { slug:"chrome-garden", n:"09", name:"Chrome Garden", frame:"#7dffc3", bg:"#041410", tilt:"-5deg" },
      { slug:"midnight-diner", n:"10", name:"Midnight Diner", frame:"#ff4d6d", bg:"#0c0c10", tilt:"8deg" }
    ];
    const stage = document.getElementById("stage");
    const dots = document.getElementById("dots");
    rooms.forEach((r, i) => {
      const s = document.createElement("section");
      s.className = "door";
      s.style.background = r.bg;
      s.innerHTML = `<div class="num">${r.n}</div>
        <a href="sites/${r.slug}/" style="--tilt:${r.tilt}">
          <div class="frame" style="border-color:${r.frame}; --shot:url('sites/${r.slug}/hero.jpg')">
            <div>
              <div class="meta">${r.n} / 10</div>
              <div class="title">${r.name}</div>
            </div>
          </div>
        </a>`;
      stage.appendChild(s);
      const b = document.createElement("button");
      b.title = r.name;
      b.onclick = () => s.scrollIntoView({ behavior:"smooth", inline:"start" });
      dots.appendChild(b);
    });
    const btns = [...dots.children];
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const i = [...stage.children].indexOf(e.target) - 1;
        btns.forEach((b, k) => b.classList.toggle("on", k === i));
      });
    }, { root: stage, threshold: .6 });
    [...stage.querySelectorAll(".door")].forEach(el => io.observe(el));
    stage.addEventListener("wheel", e => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && window.innerWidth > 720) {
        e.preventDefault();
        stage.scrollLeft += e.deltaY;
      }
    }, { passive: false });
  </script>
</body>
</html>
